name: mirthspool

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mirthspool
      POSTGRES_PASSWORD: ${MIRTHSPOOL_DATABASE_PASSWORD:?set MIRTHSPOOL_DATABASE_PASSWORD in .env}
      POSTGRES_USER: mirthspool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirthspool -d mirthspool"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ALLOW_PRIVATE_MEDIA_URLS: ${ALLOW_PRIVATE_MEDIA_URLS:-false}
      ALLOW_PRIVATE_SOURCE_URLS: ${ALLOW_PRIVATE_SOURCE_URLS:-false}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
      DATABASE_URL: postgresql://mirthspool:${MIRTHSPOOL_DATABASE_PASSWORD:?set MIRTHSPOOL_DATABASE_PASSWORD in .env}@postgres:5432/mirthspool
      MIRTHSPOOL_AUTH_SECRET: ${MIRTHSPOOL_AUTH_SECRET:?set MIRTHSPOOL_AUTH_SECRET in .env}
      MIRTHSPOOL_HEALTH_CHECK_TIMEOUT_MS: ${MIRTHSPOOL_HEALTH_CHECK_TIMEOUT_MS:-1000}
      MIRTHSPOOL_COMPLETED_JOB_RETENTION_SECONDS: ${MIRTHSPOOL_COMPLETED_JOB_RETENTION_SECONDS:-3600}
      MIRTHSPOOL_FAILED_JOB_RETENTION_SECONDS: ${MIRTHSPOOL_FAILED_JOB_RETENTION_SECONDS:-604800}
      MIRTHSPOOL_LOG_LEVEL: ${MIRTHSPOOL_LOG_LEVEL:-info}
      MIRTHSPOOL_MEDIA_CACHE_CONCURRENCY: ${MIRTHSPOOL_MEDIA_CACHE_CONCURRENCY:-2}
      MIRTHSPOOL_MEDIA_STORAGE_PATH: ${MIRTHSPOOL_MEDIA_STORAGE_PATH:-/var/lib/mirthspool/media}
      MIRTHSPOOL_MEDIA_ALLOWED_PORTS: ${MIRTHSPOOL_MEDIA_ALLOWED_PORTS:-80,443}
      MIRTHSPOOL_PORT: 3000
      MIRTHSPOOL_PUBLIC_ORIGIN: ${MIRTHSPOOL_PUBLIC_ORIGIN:-http://localhost:3000}
      MIRTHSPOOL_SOURCE_ALLOWED_PORTS: ${MIRTHSPOOL_SOURCE_ALLOWED_PORTS:-80,443}
      MIRTHSPOOL_TRUST_PROXY: ${MIRTHSPOOL_TRUST_PROXY:-false}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    init: true
    networks:
      - backend
      - frontend
    ports:
      - "127.0.0.1:${MIRTHSPOOL_HTTP_PORT:-3000}:3000"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    volumes:
      - media-cache:/var/lib/mirthspool/media:ro

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ALLOW_PRIVATE_MEDIA_URLS: ${ALLOW_PRIVATE_MEDIA_URLS:-false}
      ALLOW_PRIVATE_SOURCE_URLS: ${ALLOW_PRIVATE_SOURCE_URLS:-false}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
      DATABASE_URL: postgresql://mirthspool:${MIRTHSPOOL_DATABASE_PASSWORD:?set MIRTHSPOOL_DATABASE_PASSWORD in .env}@postgres:5432/mirthspool
      MIRTHSPOOL_HEALTH_CHECK_TIMEOUT_MS: ${MIRTHSPOOL_HEALTH_CHECK_TIMEOUT_MS:-1000}
      MIRTHSPOOL_COMPLETED_JOB_RETENTION_SECONDS: ${MIRTHSPOOL_COMPLETED_JOB_RETENTION_SECONDS:-3600}
      MIRTHSPOOL_FAILED_JOB_RETENTION_SECONDS: ${MIRTHSPOOL_FAILED_JOB_RETENTION_SECONDS:-604800}
      MIRTHSPOOL_INGESTION_MAX_DURATION_MS: ${MIRTHSPOOL_INGESTION_MAX_DURATION_MS:-60000}
      MIRTHSPOOL_INGESTION_RUN_RETENTION_DAYS: ${MIRTHSPOOL_INGESTION_RUN_RETENTION_DAYS:-30}
      MIRTHSPOOL_LOG_LEVEL: ${MIRTHSPOOL_LOG_LEVEL:-info}
      MIRTHSPOOL_MEDIA_CACHE_CONCURRENCY: ${MIRTHSPOOL_MEDIA_CACHE_CONCURRENCY:-2}
      MIRTHSPOOL_MEDIA_STORAGE_PATH: ${MIRTHSPOOL_MEDIA_STORAGE_PATH:-/var/lib/mirthspool/media}
      MIRTHSPOOL_MEDIA_ALLOWED_PORTS: ${MIRTHSPOOL_MEDIA_ALLOWED_PORTS:-80,443}
      MIRTHSPOOL_PUBLIC_ORIGIN: ${MIRTHSPOOL_PUBLIC_ORIGIN:-http://localhost:3000}
      MIRTHSPOOL_SOURCE_ALLOWED_PORTS: ${MIRTHSPOOL_SOURCE_ALLOWED_PORTS:-80,443}
      MIRTHSPOOL_SCHEDULER_INTERVAL_MS: ${MIRTHSPOOL_SCHEDULER_INTERVAL_MS:-15000}
      MIRTHSPOOL_WORKER_HEARTBEAT_INTERVAL_MS: ${MIRTHSPOOL_WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    init: true
    networks:
      - backend
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    volumes:
      - media-cache:/var/lib/mirthspool/media

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres-data:
  redis-data:
  media-cache:
