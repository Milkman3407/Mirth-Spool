name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and release metadata
        env:
          MIRTHSPOOL_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:verify
      - name: Check documentation links
        run: pnpm docs:check
      - name: Run release quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm audit --prod --audit-level high
      - name: Run Compose-backed integration tests
        run: pnpm test:integration

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  acceptance:
    name: Validate release images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and validate a clean release installation
        env:
          BUILD_VERSION: ${{ github.ref_name }}
          BUILD_REVISION: ${{ github.sha }}
        run: pnpm release:acceptance
      - name: Scan release images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL mirthspool-web:release-acceptance
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL mirthspool-worker:release-acceptance
      - name: Install Playwright browser
        run: pnpm --filter @mirthspool/e2e exec playwright install --with-deps chromium
      - name: Run browser tests against release images
        env:
          MIRTHSPOOL_WEB_IMAGE: mirthspool-web:release-acceptance
          MIRTHSPOOL_WORKER_IMAGE: mirthspool-worker:release-acceptance
        run: pnpm test:e2e:release

  images:
    name: Publish ${{ matrix.service }} image
    needs: [verify, secret-scan, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, worker]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirth-spool-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Attest published image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirth-spool-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Export immutable digest and SBOM attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirth-spool-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "${{ matrix.service }}-image.txt"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM.SPDX }}' > "${{ matrix.service }}-sbom.spdx.json"
          node -e 'const fs=require("node:fs");const sbom=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!sbom.spdxVersion||!Array.isArray(sbom.packages))throw new Error("invalid SPDX SBOM")' "${{ matrix.service }}-sbom.spdx.json"
      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.service }}-release-metadata
          path: |
            ${{ matrix.service }}-image.txt
            ${{ matrix.service }}-sbom.spdx.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release-metadata"
          merge-multiple: true
          path: release-artifacts
      - name: Publish release notes, digests, and SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "MirthSpool ${{ github.ref_name }}" \
            --notes-file docs/releases/v0.1.0.md \
            release-artifacts/*
