name: CI

env:
  NEXT_TELEMETRY_DISABLED: "1"

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check documentation links
        run: pnpm docs:check
      - name: Check forbidden repository content
        run: pnpm check:repository-safety
      - name: Verify release metadata
        env:
          MIRTHSPOOL_RELEASE_TAG: v0.1.9
        run: pnpm release:verify
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Generate ephemeral Compose credentials
        shell: bash
        run: |
          {
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MIRTHSPOOL_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_DATABASE_PASSWORD=$(openssl rand -hex 24)"
            echo "MIRTHSPOOL_SETUP_TOKEN=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_TRUSTED_PROXY_SECRET=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_PUBLIC_ORIGIN=https://localhost"
          } >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm build && pnpm test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Compose-backed integration tests
        run: pnpm test:integration

  container-builds:
    name: Production container builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate ephemeral build credentials
        shell: bash
        run: |
          {
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MIRTHSPOOL_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_DATABASE_PASSWORD=$(openssl rand -hex 24)"
            echo "MIRTHSPOOL_SETUP_TOKEN=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_TRUSTED_PROXY_SECRET=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_PUBLIC_ORIGIN=https://localhost"
          } >> "$GITHUB_ENV"
      - name: Build web and worker images
        run: docker compose build web worker

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan current working tree
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.0 dir --redact --verbose .

  dependency-scan:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level high

  container-scan:
    name: Production container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate ephemeral scan credentials
        shell: bash
        run: |
          {
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MIRTHSPOOL_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_DATABASE_PASSWORD=$(openssl rand -hex 24)"
            echo "MIRTHSPOOL_SETUP_TOKEN=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_TRUSTED_PROXY_SECRET=$(openssl rand -hex 32)"
            echo "MIRTHSPOOL_PUBLIC_ORIGIN=https://localhost"
          } >> "$GITHUB_ENV"
      - name: Build production images
        run: docker compose build web worker
      - name: Scan web and worker images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL mirthspool-web:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL mirthspool-worker:local
